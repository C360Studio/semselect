version: '3'
dotenv: ['.env']

tasks:
  default:
    cmds: [task --list]
  model:fetch:
    desc: Download and checksum the pinned public Kev GGUF (3.03 GB)
    cmds: [python3 scripts/model.py]
  model:verify:
    desc: Verify the cached model without network access
    cmds: [python3 scripts/model.py --verify]
  build:
    desc: Build the CPU runtime and HTTP service
    cmds: [docker compose build]
  up:
    desc: Verify model and start with a bounded readiness wait
    cmds:
      - task: model:verify
      - docker compose up -d --wait --wait-timeout 180
  down:
    desc: Stop this project's containers (keeps models and results)
    cmds: [docker compose -f docker-compose.yml -f docker-compose.baseline.yml down]
  logs:
    desc: Follow service and runtime logs
    cmds: [docker compose logs -f --tail 100]
  stats:
    desc: Show current container CPU and memory use
    cmds: [docker compose stats --no-stream]
  test:
    desc: Offline guard contract and evaluator tests (no inference)
    cmds:
      - go test -race ./...
      - python3 -m unittest discover -s tests -v
  lint:
    desc: Check Go formatting, vet and Compose configuration
    cmds:
      - test -z "$(gofmt -l cmd internal)"
      - go vet ./...
      - docker compose config --quiet
  check:
    desc: Run offline tests and configuration checks
    cmds:
      - task: test
      - task: lint
  test:health:
    desc: Verify the loaded runtime via the public service
    cmds: ['curl --fail --max-time 5 http://127.0.0.1:${SEMSELECT_PORT:-8084}/ready']
  smoke:
    desc: Exercise native Choice, Score and Noul against the running model
    cmds: [python3 scripts/smoke.py]
  evaluate:
    desc: Run the 48-request routing smoke set against real semselect inference
    cmds: ['python3 scripts/evaluate.py --backend semselect --url http://127.0.0.1:${SEMSELECT_PORT:-8084} --output results/semselect.json {{.CLI_ARGS}}']
  baseline:up:
    desc: Start the pinned ARM64 seminstruct baseline on port 8083
    cmds: [docker compose -f docker-compose.yml -f docker-compose.baseline.yml up -d --wait --wait-timeout 120 baseline]
  baseline:evaluate:
    desc: Evaluate the same dataset against seminstruct (no inferred probabilities)
    cmds: ['python3 scripts/evaluate.py --backend seminstruct --url http://127.0.0.1:8083 --model qwen3-0.6b --output results/seminstruct.json {{.CLI_ARGS}}']
  metal:build:
    desc: Build the pinned llama.cpp with Metal and the native guard (Apple Silicon)
    cmds: [python3 scripts/metal.py build]
  metal:serve:
    desc: Serve Kev on loopback with Metal; Ctrl-C stops both owned processes
    cmds: [python3 scripts/metal.py serve]
  metal:evaluate:
    desc: Start Metal Kev, run primitives and routing evaluation, then stop
    cmds: [python3 scripts/metal.py evaluate]
  metal:baseline:fetch:
    desc: Download and verify the matched Qwen3.5-4B Q4_K_M baseline
    cmds: [python3 scripts/model.py --lock models.baseline.lock.json]
  metal:baseline:evaluate:
    desc: Start the matched Metal Qwen baseline, evaluate, then stop
    cmds: [python3 scripts/metal.py evaluate --baseline]
  compare:metal:
    desc: Compare JSON vs complete raw option scores on Metal; preserve two trials
    cmds: [python3 scripts/compare_scoring.py --hardware metal]
  compare:cpu:
    desc: Compare the same Qwen formats in the pinned CPU Docker runtime
    cmds: [python3 scripts/compare_scoring.py --hardware cpu-docker]
  answerability:validate:
    desc: Check the 12 teaching cases offline; no model inference
    cmds: [python3 scripts/answerability.py --validate]
  answerability:metal:
    desc: Compare the frozen-evidence control, Qwen JSON and Kev on teaching cases
    cmds: [python3 scripts/answerability.py --hardware metal]
  answerability:source:validate:
    desc: Validate the frozen 24-case real-source pilot offline
    cmds: [python3 scripts/answerability.py --validate --dataset eval/answerability/heldout/cases.json --expected-dataset-sha256 74066d02a4fcff48b8363478dcbc22f9e08bc6cef5be668c859a7a50ee536594]
  answerability:source:metal:
    desc: Compare the frozen real-source pilot on Metal without tuning
    cmds: [python3 scripts/answerability.py --hardware metal --dataset eval/answerability/heldout/cases.json --expected-dataset-sha256 74066d02a4fcff48b8363478dcbc22f9e08bc6cef5be668c859a7a50ee536594]
  routing:validate:
    desc: Validate query-classification fixtures, requests and freeze without inference
    cmds: [python3 eval/query-routing/experiment.py]
  routing:test:
    desc: Test the evaluation adapters and real SemStreams classifier driver offline
    cmds:
      - python3 -m unittest discover -s eval/query-routing -p 'test_*.py' -v
      - task: routing:driver:test
  routing:driver:test:
    desc: Test the isolated classifier driver with cached pinned dependencies
    dir: eval/query-routing/driver
    cmds:
      - GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOCACHE=/tmp/semselect-query-routing-gocache go test -mod=readonly -race ./...
  routing:execution:validate:
    desc: Verify frozen execution sources and the recorded driver binary without inference
    cmds: [python3 eval/query-routing/runner.py --stage validate]
  routing:code:
    desc: Run the actual code classifier cohort; pass -- --output NEW_DIRECTORY
    cmds: ['python3 eval/query-routing/runner.py --stage code {{.CLI_ARGS}}']
  routing:metal:
    desc: Run the frozen model comparison on Metal; pass -- --output NEW_DIRECTORY
    cmds: ['python3 eval/query-routing/runner.py --stage models --hardware metal {{.CLI_ARGS}}']
  routing:cpu:
    desc: Run the frozen model comparison on CPU Docker; pass -- --output NEW_DIRECTORY
    cmds: ['python3 eval/query-routing/runner.py --stage models --hardware cpu-docker {{.CLI_ARGS}}']
  julia:fetch:
    desc: Download and checksum the isolated Julia Q8 evaluation candidate (168 MB)
    cmds: [python3 scripts/model.py --lock eval/julia/models.lock.json]
  julia:test:
    desc: Test Julia probe bounds and input preflight offline
    cmds: [python3 -m unittest discover -s eval/julia -p 'test_*.py' -v]
  julia:cpu:
    desc: Run the bounded CPU feasibility diagnostic; pass -- --output NEW_DIRECTORY
    cmds: ['python3 eval/julia/probe.py {{.CLI_ARGS}}']
  specialist:test:
    desc: Offline specialist-intent harness tests, including the real pinned classifier driver
    cmds:
      - task: routing:driver:test
      - GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOCACHE=/tmp/semselect-query-routing-gocache go -C eval/query-routing/driver build -mod=readonly -o /tmp/semselect-specialist-query-driver .
      - SEMSELECT_QUERY_DRIVER=/tmp/semselect-specialist-query-driver python3 -m unittest discover -s eval/specialist-intent -p 'test_*.py' -v
  specialist:prepare:
    desc: Freeze specialist pilot inputs without inference; pass -- --run NEW_RESULTS_DIRECTORY --driver DRIVER
    cmds: ['python3 eval/specialist-intent/runner.py prepare {{.CLI_ARGS}}']
  throughput:validate:
    desc: Verify frozen throughput inputs, rebuild requests and print planned cells; no inference
    cmds: [python3 eval/throughput/run.py --validate]
  throughput:test:
    desc: Offline throughput harness tests with loopback stub servers; no inference
    cmds: [python3 -m unittest discover -s eval/throughput -p 'test_*.py' -v]
  throughput:metal:
    desc: Run Metal llama.cpp throughput cells for one model; pass -- --model kev|qwen [--cells ...] [--output NEW_DIRECTORY]
    cmds: ['python3 eval/throughput/run.py --runtime llamacpp {{.CLI_ARGS}}']
  throughput:sglang:validate:
    desc: Map frozen throughput requests onto SGLang MLX endpoints and print the planned cells; no inference
    cmds: [python3 eval/throughput/run_sglang.py --validate]
  throughput:sglang:
    desc: Run SGLang MLX throughput cells for Qwen; pass -- --workload w1|w2 [--cells ...] [--output NEW_DIRECTORY]
    cmds: ['python3 eval/throughput/run_sglang.py --model qwen {{.CLI_ARGS}}']
  throughput:kevmlx:setup:
    desc: Fetch and record the pinned Kev MLX environment under .kev/ (network, ~11.7 GB); refuses below 12 GiB free
    cmds: [python3 eval/throughput/kevmlx_setup.py]
  throughput:kevmlx:verify:
    desc: Re-check every recorded .kev/ byte offline
    cmds: [python3 eval/throughput/kevmlx_setup.py --verify]
  throughput:kevmlx:validate:
    desc: Verify frozen inputs, rebuild Kev MLX requests and print planned cells; no inference
    cmds: [python3 eval/throughput/run_kevmlx.py --validate]
  throughput:kevmlx:
    desc: Run Kev MLX (kev.serve, bf16 backbone, fp32 head) throughput cells; pass -- [--cells ...] [--workload ...] [--output NEW_DIRECTORY]
    cmds: ['python3 eval/throughput/run_kevmlx.py {{.CLI_ARGS}}']
